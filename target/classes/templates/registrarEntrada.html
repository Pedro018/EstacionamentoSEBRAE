<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar entrada | Estacionamento</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<main class="page-container">
    <section class="card card-wide">
        <header class="card-header">
            <span class="brand-badge">Estacionamento</span>
            <h1>Registrar Entrada de Veículo</h1>
            <p>Preencha os dados do veículo para registrar a entrada no estacionamento.</p>
        </header>

        <div th:if="${mensagemSucesso}" class="success-box">
            <span class="success-icon">✓</span>
            <div>
                <strong th:text="${mensagemSucesso}">Sucesso!</strong>
            </div>
        </div>
        <div th:if="${mensagemErro}" class="error-box" th:text="${mensagemErro}">Erro</div>

        <form action="/veiculo/cadastro" method="post" class="form form-grid">
            <div class="form-group">
                <label for="placa">Placa</label>
                <input type="text" id="placa" name="placa" placeholder="Digite a placa" maxlength="8" required>
            </div>

            <div class="form-group">
                <label for="modelo">Modelo</label>
                <input type="text" id="modelo" name="modelo" placeholder="Digite o modelo do veículo" required>
            </div>

            <div class="form-group">
                <label for="cor">Cor</label>
                <input type="text" id="cor" name="cor" placeholder="Digite a cor" required>
            </div>

            <div class="form-group full-width">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" name="observacoes" rows="4" placeholder="Informações adicionais (opcional)"
                          style="width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:10px;font:inherit;resize:vertical;"></textarea>
            </div>

            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary">Salvar Entrada</button>
                <a href="/painel" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </section>
    <footer class="project-footer">
        <strong>Projeto desenvolvido para o SEBRAE</strong>
        <span>Estacionamento • Gestão simples e eficiente</span>
    </footer>
</main>
</body>
</html>
