<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Estacionamento</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<main class="page-container">
    <section class="card card-wide">
        <header class="card-header">
            <span class="brand-badge">Estacionamento</span>
            <h1>Criar cadastro</h1>
            <p>Preencha seus dados para acessar o sistema.</p>
        </header>

        <form action="/efetuar-cadastro" method="post" class="form form-grid">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" inputmode="numeric" maxlength="14" required>
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de nascimento</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone">
            </div>

            <div class="form-group full-width">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" minlength="6" required>
            </div>

            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary">Cadastrar</button>
                <a href="/" class="btn btn-secondary">Voltar para o login</a>
            </div>
        </form>
    </section>

    <footer class="project-footer">
        <strong>Projeto desenvolvido para o SEBRAE</strong>
        <span>Estacionamento • Gestão simples e eficiente</span>
    </footer>
</main>
</body>
</html>
