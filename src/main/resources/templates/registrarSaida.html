<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar saída | Estacionamento</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<main class="page-container">
    <section class="card card-wide">
        <header class="card-header">
            <span class="brand-badge">Estacionamento</span>
            <h1>Registrar Saída de Veículo</h1>
            <p>Selecione o veículo que está deixando o estacionamento.</p>
        </header>

        <div th:if="${mensagemErro}" class="error-box" th:text="${mensagemErro}">Erro</div>

        <div th:if="${#lists.isEmpty(veiculosEstacionados)}" class="empty-state">
            Nenhum veículo estacionado no momento.
        </div>

        <div th:if="${not #lists.isEmpty(veiculosEstacionados)}" class="table-wrapper">
            <table class="veiculos-table">
                <thead>
                    <tr>
                        <th>Placa</th>
                        <th>Modelo</th>
                        <th>Entrada</th>
                        <th>Permanência</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="veiculo : ${veiculosEstacionados}">
                        <td th:text="${veiculo.placa}">Placa</td>
                        <td th:text="${veiculo.modelo}">Modelo</td>
                        <td th:text="${#temporals.format(veiculo.horaEntrada, 'HH:mm')}">Entrada</td>
                        <td th:text="${veiculo.tempoPermanencia}">Permanência</td>
                        <td>
                            <form th:action="@{/veiculo/registrarSaida}" action="#" method="post" class="inline-form"
                                  onsubmit="return confirm('Confirmar saída?');">
                                <input type="hidden" name="id" th:value="${veiculo.id}">
                                <button type="submit" class="btn btn-primary">Confirmar Saída</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="form-actions">
            <a href="/painel" class="btn btn-secondary">Cancelar</a>
        </div>
    </section>
    <footer class="project-footer">
        <strong>Projeto desenvolvido para o SEBRAE</strong>
        <span>Estacionamento • Gestão simples e eficiente</span>
    </footer>
</main>
</body>
</html>
